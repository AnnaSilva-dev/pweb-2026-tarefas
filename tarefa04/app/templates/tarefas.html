<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas</title>
</head>
<body>
    <h1>Lista de Tarefas</h1>
    {% for tarefa in tarefas %}
    <li>
        <p>{{ tarefa.nome }}</p>
        <p>{{ tarefa.status }}</p>
        <p>{{ tarefa.prazo }}</p>
    {% endfor %}
    <a href="/">Voltar</a>
</body>
</html>
